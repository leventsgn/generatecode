services:
  - type: web
    name: generatecode-web
    runtime: node
    rootDir: web
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
